name: Tests

on:
    workflow_dispatch:
    push:
        branches: ["**"]
    pull_request:
        branches: [main]

jobs:
    backend-test:
        name: Run pytest
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.13"
                  cache: "pip"
                  cache-dependency-path: "setup.py"

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -e .
                  pip install pytest pytest-cov

            - name: Run tests
              run: pytest tests/ -v --tb=short --cov=tester --cov-report=term-missing --cov-report=xml:coverage.xml

            - name: Upload coverage report
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: coverage-report
                  path: coverage.xml

    frontend-test:
        name: Run Jest
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"
                  cache-dependency-path: tester-frontend/package-lock.json

            - name: Install dependencies
              working-directory: tester-frontend
              run: npm ci

            - name: Run tests
              working-directory: tester-frontend
              run: npm run test:ci

            - name: Build static frontend
              working-directory: tester-frontend
              run: npm run build

            - name: Verify static export
              run: test -f tester/frontend/index.html

            - name: Upload static frontend
              uses: actions/upload-artifact@v4
              with:
                  name: tester-frontend-${{ github.sha }}
                  path: tester/frontend
                  if-no-files-found: error
                  retention-days: 14
